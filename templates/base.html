<!DOCTYPE html>
<html lang="en" data-theme="{{ current_user.theme if current_user.is_authenticated else 'dark' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Orbit — Learn by watching{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-stack" id="flash-stack">
    {% for category, message in messages %}
      <div class="flash flash--{{ category }}">
        <span>{{ message }}</span>
        <button class="flash__close" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>
      </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
